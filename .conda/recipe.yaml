package:
  name: immunedeconv
  version: "develop"

source:
  path: ".."

build:
  script: R CMD INSTALL --build .
  number: 0
  noarch: generic

requirements:
  host:
    - r-base >=4.1
    - r-dplyr >=0.7
    - r-magrittr >=1.5
    - r-readr >=1.4
    - r-readxl >=1.0
    - r-testit >=0.7
    - r-tibble >=1.4.2
    - r-data.tree >=0.7
    - r-limsolve >=1.5.5.1
    - r-e1071 >=1.6
    - bioconductor-biobase
    - bioconductor-biocparallel
    - bioconductor-preprocesscore
    - bioconductor-sva
    - bioconductor-quantiseqr
    - r-xcell >=1.2
    - r-epic >=1.1
    - r-mcpcounter
    - bioconductor-biomart
    - r-comics
    - r-consensustme
    - r-mmcpcounter
  run:
    - r-base >=4.1
    - r-dplyr >=0.7
    - r-magrittr >=1.5
    - r-readr >=1.4
    - r-readxl >=1.0
    - r-testit >=0.7
    - r-tibble >=1.4.2
    - r-data.tree >=0.7
    - r-limsolve >=1.5.5.1
    - r-e1071 >=1.6
    - bioconductor-biobase
    - bioconductor-biocparallel
    - bioconductor-preprocesscore
    - bioconductor-sva
    - bioconductor-quantiseqr
    - r-xcell >=1.2
    - r-epic >=1.1
    - r-mcpcounter
    - bioconductor-biomart
    - r-comics
    - r-consensustme
    - r-mmcpcounter

tests:
  - r:
      libraries:
        - immunedeconv

about:
  repository: https://github.com/omnideconv/immunedeconv
  homepage: https://omnideconv.org/immunedeconv/
  license: GPL-2.0-only
  summary: "collection of methods for immune cell deconvolution of bulk RNA-seq samples."
  license_file: LICENSE
  description: Collection of methods for immune cell deconvolution of bulk RNA-seq samples.

extra:
  identifiers:
    - doi:10.1101/463828
